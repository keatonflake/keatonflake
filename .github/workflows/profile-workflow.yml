name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]

permissions: {}

concurrency: koi

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # No checkout: no repo content or stored git credentials to steal.
      - uses: yalongwastaken/git-koi@7305e9b1fadee6f43d3b4fa543a25d4cde79856e  # v1.0.2
        with:
          body: white
          output-dir: koi
      - uses: actions/upload-artifact@v4
        with:
          name: koi
          path: koi/koi.gif
          if-no-files-found: error

  commit:
    needs: draw
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: koi
          path: koi
      - name: Validate and commit
        shell: bash
        run: |
          f=koi/koi.gif
          magic=$(head -c 6 "$f")
          [ "$magic" = "GIF89a" ] || [ "$magic" = "GIF87a" ] || { echo "not a GIF"; exit 1; }
          [ "$(stat -c %s "$f")" -lt 5000000 ] || { echo "too large"; exit 1; }
          git add "$f"
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
